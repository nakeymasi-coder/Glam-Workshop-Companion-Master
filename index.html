<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Workshop Companion</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <button id="menuBtn" class="menu" aria-label="Open menu">☰</button>
    <aside>
      <div class="brand">
        <span>GLAM WORKSHOP</span>
        <h2 id="sideTitle"></h2>
      </div>
      <nav id="nav"></nav>
      <div class="progress">
        <span id="progressText">0% complete</span>
        <div><i id="progressBar"></i></div>
      </div>
    </aside>
    <main>
      <header>
        <p id="eyebrow"></p>
        <h1 id="pageTitle"></h1>
        <p id="pageIntro"></p>
      </header>
      <div id="page"></div>
    </main>
    <div id="toast" role="status"></div>
    <script src="js/workshop-settings.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
